<svg xmlns="http://www.w3.org/2000/svg" width="840" height="365" viewBox="0 0 840 365" role="img" aria-labelledby="title desc"><title id="title">两路超标量流水线示意</title><desc id="desc">I1和I2在周期1一起取指，I3和I4在周期2一起取指，各指令依次经过取指、译码、执行、访存和写回。</desc><rect width="840" height="365" rx="16" fill="#faf8f3"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#2b2924"><text x="30" y="38" font-size="23" font-weight="600">超标量：同一周期可发射多条指令</text><text x="163" y="78" text-anchor="middle" font-size="17">周期 1</text><text x="269" y="78" text-anchor="middle" font-size="17">周期 2</text><text x="375" y="78" text-anchor="middle" font-size="17">周期 3</text><text x="481" y="78" text-anchor="middle" font-size="17">周期 4</text><text x="587" y="78" text-anchor="middle" font-size="17">周期 5</text><text x="693" y="78" text-anchor="middle" font-size="17">周期 6</text><text x="52" y="127" font-size="18">I1</text><rect x="112" y="100" width="99" height="40" rx="6" fill="#dce9e3" stroke="#b7b8ae"/><text x="161" y="126" text-anchor="middle" font-size="17">取指</text><rect x="218" y="100" width="99" height="40" rx="6" fill="#dce9e3" stroke="#b7b8ae"/><text x="267" y="126" text-anchor="middle" font-size="17">译码</text><rect x="324" y="100" width="99" height="40" rx="6" fill="#dce9e3" stroke="#b7b8ae"/><text x="373" y="126" text-anchor="middle" font-size="17">执行</text><rect x="430" y="100" width="99" height="40" rx="6" fill="#dce9e3" stroke="#b7b8ae"/><text x="479" y="126" text-anchor="middle" font-size="17">访存</text><rect x="536" y="100" width="99" height="40" rx="6" fill="#dce9e3" stroke="#b7b8ae"/><text x="585" y="126" text-anchor="middle" font-size="17">写回</text><text x="52" y="176" font-size="18">I2</text><rect x="112" y="149" width="99" height="40" rx="6" fill="#dce9e3" stroke="#b7b8ae"/><text x="161" y="175" text-anchor="middle" font-size="17">取指</text><rect x="218" y="149" width="99" height="40" rx="6" fill="#dce9e3" stroke="#b7b8ae"/><text x="267" y="175" text-anchor="middle" font-size="17">译码</text><rect x="324" y="149" width="99" height="40" rx="6" fill="#dce9e3" stroke="#b7b8ae"/><text x="373" y="175" text-anchor="middle" font-size="17">执行</text><rect x="430" y="149" width="99" height="40" rx="6" fill="#dce9e3" stroke="#b7b8ae"/><text x="479" y="175" text-anchor="middle" font-size="17">访存</text><rect x="536" y="149" width="99" height="40" rx="6" fill="#dce9e3" stroke="#b7b8ae"/><text x="585" y="175" text-anchor="middle" font-size="17">写回</text><text x="52" y="225" font-size="18">I3</text><rect x="218" y="198" width="99" height="40" rx="6" fill="#e8dcf0" stroke="#b7b8ae"/><text x="267" y="224" text-anchor="middle" font-size="17">取指</text><rect x="324" y="198" width="99" height="40" rx="6" fill="#e8dcf0" stroke="#b7b8ae"/><text x="373" y="224" text-anchor="middle" font-size="17">译码</text><rect x="430" y="198" width="99" height="40" rx="6" fill="#e8dcf0" stroke="#b7b8ae"/><text x="479" y="224" text-anchor="middle" font-size="17">执行</text><rect x="536" y="198" width="99" height="40" rx="6" fill="#e8dcf0" stroke="#b7b8ae"/><text x="585" y="224" text-anchor="middle" font-size="17">访存</text><rect x="642" y="198" width="99" height="40" rx="6" fill="#e8dcf0" stroke="#b7b8ae"/><text x="691" y="224" text-anchor="middle" font-size="17">写回</text><text x="52" y="274" font-size="18">I4</text><rect x="218" y="247" width="99" height="40" rx="6" fill="#e8dcf0" stroke="#b7b8ae"/><text x="267" y="273" text-anchor="middle" font-size="17">取指</text><rect x="324" y="247" width="99" height="40" rx="6" fill="#e8dcf0" stroke="#b7b8ae"/><text x="373" y="273" text-anchor="middle" font-size="17">译码</text><rect x="430" y="247" width="99" height="40" rx="6" fill="#e8dcf0" stroke="#b7b8ae"/><text x="479" y="273" text-anchor="middle" font-size="17">执行</text><rect x="536" y="247" width="99" height="40" rx="6" fill="#e8dcf0" stroke="#b7b8ae"/><text x="585" y="273" text-anchor="middle" font-size="17">访存</text><rect x="642" y="247" width="99" height="40" rx="6" fill="#e8dcf0" stroke="#b7b8ae"/><text x="691" y="273" text-anchor="middle" font-size="17">写回</text><text x="30" y="323" font-size="17">例：两路、无停顿时，填满后每周期最多完成两条，理想 CPI = 0.5。</text><text x="30" y="348" font-size="15" fill="#64645c">前提：有足够功能部件，且指令之间的依赖允许并行；实际还会受停顿限制。</text></g></svg>